<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neon Vice Cover Studio</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header class="topbar">
  <h1>Neon Vice <span>Cover Studio</span></h1>
  <p>Your photo, your words — a Vice City poster in three clicks.</p>
</header>
<main class="app">
  <section class="controls">
    <div class="group">
      <h2>1 · Photo</h2>
      <label class="upload">Upload your photos
        <input id="upload" type="file" accept="image/*" multiple>
      </label>
      <div id="sample-bar" class="sample-bar">
        <span>or try a sample:</span>
        <button type="button" data-sample="pier">Pier sunset</button>
        <button type="button" data-sample="boulevard">Boulevard neon</button>
        <button type="button" data-sample="skyline">Skyline dusk</button>
      </div>
    </div>
    <div class="group">
      <h2>2 · Panels</h2>
      <div id="layout-picker" class="picker">
        <button type="button" data-value="hero" class="active">Hero split</button>
        <button type="button" data-value="triptych">Triptych</button>
        <button type="button" data-value="quad">Four up</button>
        <button type="button" data-value="single">Single frame</button>
      </div>
      <div id="panel-strip" class="panel-strip"></div>
      <label>Zoom <output id="zoom-val">1.00x</output>
        <input id="zoom" type="range" min="1" max="2.5" step="0.05" value="1">
      </label>
      <label>Pan left–right
        <input id="ox" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <label>Pan up–down
        <input id="oy" type="range" min="-0.5" max="0.5" step="0.01" value="0">
      </label>
      <p class="hint">Click a panel to select it, or drag its photo right on the cover.</p>
    </div>
    <div class="group">
      <h2>3 · Words</h2>
      <label>Caption
        <input id="caption" type="text" maxlength="40" value="Sunset Heist">
      </label>
      <label>Tagline
        <input id="tagline" type="text" maxlength="40" value="Vice City Nights">
      </label>
    </div>
    <div class="group">
      <h2>4 · Grade</h2>
      <div id="grade-picker" class="picker">
        <button type="button" data-value="sunset" class="active">Sunset</button>
        <button type="button" data-value="neon">Neon</button>
        <button type="button" data-value="dusk">Dusk</button>
        <button type="button" data-value="noir">Noir</button>
      </div>
    </div>
    <div class="group">
      <h2>5 · Export</h2>
      <div id="size-picker" class="picker">
        <button type="button" data-value="1080x1080">1080 x 1080</button>
        <button type="button" data-value="1080x1350">1080 x 1350</button>
        <button type="button" data-value="1920x1080" class="active">1920 x 1080</button>
      </div>
      <button id="export" type="button" class="export">Export PNG</button>
      <p id="status" role="status"></p>
    </div>
  </section>
  <section class="preview">
    <canvas id="cover" width="1920" height="1080" aria-label="The cover"></canvas>
  </section>
</main>
<script type="module" src="./src/main.js"></script>
</body>
</html>
